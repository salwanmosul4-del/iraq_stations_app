name: mosul_gas
description: تطبيق مجتمعي لمعرفة حالة محطات الوقود في العراق
publish_to: 'none'

# الرقم بعد + هو versionCode. يجب أن يكون أكبر من رقم آخر نسخة رُفعت إلى Google Play.
version: 1.3.0+3

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_mobile_ads: ^6.0.0
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.0
  geolocator: ^13.0.0
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.0
  flutter_map: '>=7.0.2 <9.0.0'
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
